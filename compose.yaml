services:
  plaintext:
    build: .
    ports:
      - "127.0.0.1:19283:19283"
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
      TLS_KEY_PATH: /certs/tls.key
      TLS_CERT_PATH: /certs/tls.crt
    volumes:
      - ./certs:/certs:ro
      - rss_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped
volumes:
  rss_data:
