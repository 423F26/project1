<svg xmlns="http://www.w3.org/2000/svg" width="920" height="455" viewBox="0 0 920 455" role="img" aria-labelledby="title description"><title id="title">Agile sprint burndown chart</title><desc id="description">Remaining task count for sprints with recorded completed work.</desc><style>text{font:12px system-ui,sans-serif;fill:#24313d}.title{font-size:18px;font-weight:700}.axis-label,.notes-title{font-weight:700}.notes-title{font-size:14px}.note{font-size:11px}.legend{fill:#536471}.axis{stroke:#94a3b8}.ideal{stroke:#94a3b8;stroke-width:2;stroke-dasharray:5 4}.actual{fill:none;stroke:#136f63;stroke-width:3}.added{fill:#a16207}.completed{fill:#136f63}</style><rect width="100%" height="100%" fill="#fff"/><g><text x="30" y="50" class="title">Sprint 1 burndown</text><text x="30" y="72">Time period: 2026-09-09 to 2026-09-16 (inclusive)</text><line x1="180" y1="95" x2="180" y2="235" class="axis"/><line x1="180" y1="235" x2="870" y2="235" class="axis"/><text x="166" y="99" text-anchor="end">3</text><text x="166" y="239" text-anchor="end">0</text><text x="55" y="170" text-anchor="middle" transform="rotate(-90 55 170)" class="axis-label">Remaining tasks</text><text x="180" y="288">2026-09-09</text><text x="870" y="288" text-anchor="end">2026-09-16</text><text x="525" y="313" text-anchor="middle" class="axis-label">Date</text><line x1="180" y1="115" x2="870" y2="235" class="ideal"/><polyline points="180.0,115.0 377.1,115.0 377.1,155.0 870.0,155.0 870.0,235.0 870.0,235.0" class="actual"/><circle cx="377.1" cy="247" r="4" class="completed"/><text x="377.1" y="264" text-anchor="middle">−#1</text><circle cx="870.0" cy="247" r="4" class="completed"/><text x="870.0" y="264" text-anchor="middle">−#2,#4</text><text x="700" y="50" class="legend">— actual · ┄ ideal</text><text x="30" y="325" class="notes-title">Advisor notes</text><text x="30" y="348" class="note">Remaining work = tasks added on/before a date minus tasks completed on/before it. Initial scope: 3 tasks.</text><text x="30" y="371" class="note">Scope: no additions after the sprint started.</text><text x="30" y="394" class="note">Progress: #1 completed 2026-09-11; #2,#4 completed 2026-09-16.</text><text x="30" y="417" class="note">Flat periods: 2026-09-09–2026-09-10 (no recorded scope or completion change); 2026-09-11–2026-09-15 (no recorded scope or completion change).</text></g></svg>
