<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title description"><title id="title">Agile sprint burndown chart</title><desc id="description">Remaining task count for sprints with recorded completed work.</desc><style>text{font:12px system-ui,sans-serif;fill:#24313d}.title{font-size:18px;font-weight:700}.axis-label{font-weight:700}.note,.change-label{font-size:11px}.legend{fill:#536471}.axis{stroke:#94a3b8}.ideal{stroke:#94a3b8;stroke-width:2;stroke-dasharray:5 4}.actual{fill:none;stroke:#136f63;stroke-width:3}.added{fill:#a16207}.completed{fill:#136f63}</style><rect width="100%" height="100%" fill="#fff"/><g><text x="30" y="50" class="title">Sprint 1 burndown</text><text x="30" y="72">Time period: 2026-09-09 to 2026-09-16 (inclusive)</text><line x1="180" y1="100" x2="180" y2="310" class="axis"/><line x1="180" y1="310" x2="870" y2="310" class="axis"/><text x="166" y="104" text-anchor="end">3</text><text x="166" y="314" text-anchor="end">0</text><text x="55" y="205" text-anchor="middle" transform="rotate(-90 55 205)" class="axis-label">Remaining tasks</text><text x="180" y="350">2026-09-09</text><text x="870" y="350" text-anchor="end">2026-09-16</text><text x="525" y="375" text-anchor="middle" class="axis-label">Date</text><line x1="180" y1="120" x2="870" y2="310" class="ideal"/><polyline points="180.0,120.0 377.1,120.0 377.1,183.3 870.0,183.3 870.0,310.0 870.0,310.0" class="actual"/><circle cx="377.1" cy="183.3" r="4" class="completed"/><text x="377.1" y="173.3" text-anchor="middle" class="change-label">#1 · 2026-09-11</text><circle cx="870.0" cy="310.0" r="4" class="completed"/><text x="870.0" y="300.0" text-anchor="middle" class="change-label">#2, #4 · 2026-09-16</text><text x="700" y="50" class="legend">— actual · ┄ ideal</text><text x="30" y="410" class="note">Flat periods: 2026-09-09–2026-09-10 (no recorded scope or completion change); 2026-09-11–2026-09-15 (no recorded scope or completion change).</text></g></svg>
