<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-de="Finanzberichtsprüfung | ESOF423 Gruppe 1">Financial Statement Review | ESOF423 Group #1</title>
  <style>
    :root { color-scheme: dark; --surface: #101214; --text: #eeeae3; --muted: #b8b8b5; --separator: #34373b; --control: #777; --accent: #bfd8ed; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 40px; background: #000; color: var(--text); font: 400 16px/1.6 Arial, Helvetica, sans-serif; }
    .shell { max-width: 1086px; margin: auto; }
    header.shell { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding-bottom: 28px; margin-bottom: 32px; border-bottom: 1px solid var(--separator); }
    h1 { margin: 0 0 10px; font: 400 40px/1.15 Georgia, 'Times New Roman', serif; letter-spacing: -1px; }
    h1, h2, h3 { overflow-wrap: anywhere; }
    p { margin: 0; }
    .subtitle, .meta, .feed-empty { color: var(--muted); font-size: 14px; }
    button { min-height: 44px; padding: 8px 20px; border: 1px solid var(--control); border-radius: 22px; background: #000; color: var(--text); font: inherit; cursor: pointer; }
    #language-toggle { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
    button:hover { background: var(--surface); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .skip-link { position: absolute; top: 8px; left: 16px; padding: 8px 16px; background: var(--accent); color: #000; transform: translateY(-200%); }
    .skip-link:focus { transform: none; }
    .search-card { padding: 28px; border: 1px solid var(--separator); border-radius: 12px; background: var(--surface); }
    .search-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 24px; }
    .search-heading { flex: 1; margin: 0; font-size: 20px; line-height: 1.35; font-weight: 500; }
    .market { display: flex; flex-wrap: wrap; gap: 6px 16px; max-width: 330px; min-width: 0; margin: 0; padding: 0; border: 0; font-size: 14px; }
    .market legend { margin-bottom: 4px; color: var(--muted); }
    .market-option { display: inline-flex; align-items: baseline; gap: 7px; }
    .market .coming-soon { color: var(--muted); }
    .search-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .8fr) minmax(0, 1.7fr); gap: 20px 16px; align-items: end; }
    .search-field { min-width: 0; }
    .company-field { grid-column: 1 / -1; }
    .search-field label { display: block; margin-bottom: 7px; font-size: 14px; line-height: 1.5; }
    .search-field input, .search-field select { width: 100%; min-width: 0; min-height: 46px; padding: 10px 12px; border: 1px solid var(--control); border-radius: 8px; background: #000; color: var(--text); font: inherit; }
    .search-field input { min-height: 54px; padding: 12px 16px; font-size: 18px; }
    .search-field input::placeholder { color: #949494; opacity: 1; }
    .search-actions { display: flex; justify-content: flex-end; margin-top: 24px; }
    .search-actions button { min-height: 48px; padding-inline: 22px; border-color: var(--accent); border-radius: 8px; background: var(--accent); color: #000; font-weight: 500; }
    .search-actions button:hover { background: #c6e0fa; }
    .feed { padding-top: 40px; }
    .feed-heading { margin: 0; padding-bottom: 18px; border-bottom: 1px solid var(--separator); font: 400 28px/1.25 Georgia, 'Times New Roman', serif; }
    article { display: grid; grid-template-columns: 104px minmax(0, 1fr); column-gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--separator); }
    .meta { grid-column: 1; grid-row: 1 / 3; padding-top: 4px; font-variant-numeric: tabular-nums; line-height: 1.5; overflow-wrap: anywhere; }
    .publisher { display: block; margin-bottom: 6px; color: var(--text); font-weight: 500; }
    article h3 { grid-column: 2; margin: 0 0 10px; font: 400 23px/1.35 Georgia, 'Times New Roman', serif; }
    article a { color: var(--text); text-decoration-thickness: 1px; text-decoration-color: #939da5; text-underline-offset: 5px; }
    article a:hover { color: var(--accent); }
    .summary { grid-column: 2; max-width: 70ch; color: #d2d2cf; overflow-wrap: anywhere; }
    .feed-empty { padding: 32px 0; border-bottom: 1px solid var(--separator); }
    @media (max-width: 760px) {
      body { padding: 24px; }
      h1 { font-size: 34px; }
      .search-header { display: block; }
      .search-heading { margin-bottom: 16px; }
      .search-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .topic-field { grid-column: 1 / -1; }
      article { grid-template-columns: 82px minmax(0, 1fr); column-gap: 16px; }
    }
    @media (max-width: 480px) {
      body { padding: 20px 16px; }
      header.shell { align-items: flex-start; flex-direction: column; gap: 16px; }
      h1 { font-size: 30px; letter-spacing: -.5px; }
      .search-card { padding: 20px 18px; }
      .search-grid { grid-template-columns: minmax(0, 1fr); }
      .company-field, .topic-field { grid-column: auto; }
      .search-field input { font-size: 16px; }
      .search-actions button { width: 100%; }
      article { display: block; }
      .meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-bottom: 10px; }
      .publisher { margin: 0; }
      article h3 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main" data-de="Zum Hauptinhalt">Skip to main content</a>
  <header class="shell"><div><h1 data-de="Finanzberichte prüfen">Financial review</h1><p class="subtitle" data-de="Unternehmensberichte und aktuelle Meldungen">Company filings and source updates</p></div><button id="language-toggle" type="button" aria-label="Switch page to German" data-de-aria-label="Seite auf Englisch anzeigen"><span id="language-flag" aria-hidden="true">🇩🇪</span><span id="language-name">Deutsch</span></button></header>
  <main id="main" class="shell" tabindex="-1">
  <section class="search-area" aria-label="Search controls" data-de-aria-label="Suchsteuerung"><div class="search-card">
    <div class="search-header"><h2 class="search-heading" data-de="Unternehmensberichte finden">Find company filings</h2>
    <fieldset class="market" aria-label="Filing market" data-de-aria-label="Markt für Berichte">
      <legend data-de="Markt für Berichte">Filing market</legend>
      <span class="market-option selected" aria-current="true"><span aria-hidden="true">🇺🇸</span> <span data-de="Vereinigte Staaten · Ausgewählt">United States · Selected</span></span>
      <span class="market-option coming-soon" aria-disabled="true"><span aria-hidden="true">🇩🇪</span> <span data-de="Deutschland · Noch nicht verfügbar">Germany · Not available yet</span></span>
    </fieldset>
    </div>
    <div class="search-grid">
      <div class="search-field company-field"><label for="us-company" data-de="Unternehmen, Börsenkürzel oder Link zu einem SEC-Bericht">Company, ticker, or SEC filing link</label><input id="us-company" type="search" placeholder="e.g., PepsiCo or PEP" data-de-placeholder="z. B. PepsiCo oder PEP"></div>
      <div class="search-field"><label for="us-type" data-de="Berichtsart">Filing type</label><select id="us-type"><option data-de="Jahresbericht (10-K)">Annual report (10-K)</option><option data-de="Quartalsbericht (10-Q)">Quarterly report (10-Q)</option><option data-de="Alle Berichte">Any filing</option></select></div>
      <div class="search-field"><label for="us-period" data-de="Zeitraum">Period</label><select id="us-period"><option data-de="Alle Jahre">Any year</option><option>2025</option><option>2024</option><option>2023</option></select></div>
      <div class="search-field topic-field"><label for="us-topic" data-de="Thema eingrenzen (optional)">Focus on a topic (optional)</label><select id="us-topic"><option data-de="Alle Themen">All topics</option><option data-de="Umsatzrealisierung">Revenue recognition</option><option data-de="Rückstellungen und Schätzungen">Reserves and estimates</option><option data-de="Abschreibungen und Nutzungsdauern">Depreciation and useful lives</option><option data-de="Nicht-GAAP-Kennzahlen">Non-GAAP measures</option></select></div>
    </div>
    <div class="search-actions"><button type="button"><span data-de="Berichte suchen">Find filings</span></button></div>
  </div></section>
  <section class="feed" aria-label="Latest financial updates" data-de-aria-label="Aktuelle Finanzmeldungen">
    <h2 class="feed-heading" data-de="Aktuelle Meldungen">Latest updates</h2>
    <!-- FEED_ITEMS -->
  </section></main>
  <script data-cfasync="false">
    const languageKey = 'pageLanguage';
    const toggle = document.getElementById('language-toggle');
    const text = [...document.querySelectorAll('[data-de]')].map(element => ({
      element, en: element.textContent, de: element.getAttribute('data-de')
    }));
    const attributes = ['aria-label', 'placeholder', 'alt'].flatMap(attribute =>
      [...document.querySelectorAll(`[data-de-${attribute}]`)].map(element => ({
        element, attribute, en: element.getAttribute(attribute), de: element.getAttribute(`data-de-${attribute}`)
      }))
    );
    function showLanguage(language) {
      for (const item of text) item.element.textContent = item[language];
      for (const item of attributes) item.element.setAttribute(item.attribute, item[language]);
      document.documentElement.lang = language;
      document.getElementById('language-name').textContent = language === 'de' ? 'English' : 'Deutsch';
      document.getElementById('language-flag').textContent = language === 'de' ? '🇺🇸' : '🇩🇪';
    }
    let savedLanguage;
    try { savedLanguage = localStorage.getItem(languageKey); } catch (_) { /* Private storage may be unavailable. */ }
    let language = savedLanguage === 'de' ? 'de' : 'en';
    showLanguage(language);
    toggle.addEventListener('click', () => {
      language = language === 'en' ? 'de' : 'en';
      showLanguage(language);
      try { localStorage.setItem(languageKey, language); } catch (_) { /* Keep the current-visit choice. */ }
    });
  </script>
</body>
</html>
