<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-de="Finanzberichtsprüfung | ESOF423 Gruppe 1">Financial Statement Review | ESOF423 Group #1</title>
  <style>
    body { margin: 0; padding: 16px; background: #000; color: #eee; font: 16px Arial, sans-serif; }
    .shell { max-width: 850px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; }
    header.shell { max-width: 1086px; }
    h1 { margin: 0; font-size: 22px; }
    .search-area { padding: 12px 0; border-top: 1px solid #555; border-bottom: 1px solid #555; }
    .search { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input[type="text"] { width: 300px; padding: 5px; border: 1px solid #666; background: #111; color: #eee; }
    .filters { font-size: 13px; }
    button { padding: 5px 10px; border: 1px solid #666; background: #222; color: #eee; cursor: pointer; }
    main { padding: 16px 0; }
    article { margin-bottom: 12px; padding: 10px; background: #111; border: 1px solid #444; }
    .meta { color: #aaa; font-size: 13px; }
    h2 { margin: 3px 0 6px; font-size: 18px; }
    .summary { margin: 0; }
    .feed-heading { margin-bottom: 12px; }
    .feed-empty { color: #aaa; }

    .search-shell { max-width: 1086px; margin: auto; }
    .search-card { padding: 14px; border: 1px solid #444; border-radius: 10px; background: #111; }
    .search-heading { margin: 0 0 10px; color: #ddd; font-size: 14px; }
    .market { display: flex; width: fit-content; gap: 4px; margin: 0 0 15px; padding: 4px; border: 0; border-radius: 8px; background: #1b1b1b; }
    .market-option { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border: 1px solid transparent; border-radius: 6px; color: #aaa; font-size: 13px; font-weight: 600; }
    .market .selected { border-color: #555; background: #292929; color: #fff; }
    .market .coming-soon { color: #aaa; cursor: default; }
    .search-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(160px, .85fr) minmax(135px, .7fr); gap: 12px; align-items: end; }
    .search-field { min-width: 0; }
    .search-field label { display: block; margin-bottom: 6px; color: #ccc; font-size: 12px; font-weight: 600; }
    .search-field input, .search-field select { width: 100%; height: 40px; padding: 0 10px; border: 1px solid #555; border-radius: 6px; background: #090909; color: #eee; font: inherit; font-size: 13px; }
    .search-field input::placeholder { color: #888; }
    .search-field input:focus, .search-field select:focus { outline: 2px solid #528ac8; outline-offset: 1px; }
    .topic-field { grid-column: 1 / -1; margin-top: 0; }
    .us-fields { display: grid; }
    .search-actions { display: flex; align-items: center; gap: 12px; margin-top: 15px; }
    .search-actions button { min-height: 38px; padding: 0 15px; border: 1px solid #4b78aa; border-radius: 6px; background: #214f7d; color: #fff; font-size: 13px; font-weight: 600; }
    .search-note { margin: 0; color: #999; font-size: 11px; }
    @media (max-width: 700px) { .search-grid { grid-template-columns: 1fr 1fr; } .search-grid .company-field, .search-grid .topic-field { grid-column: 1 / -1; } }
      @media (max-width: 440px) { .search-grid { grid-template-columns: 1fr; } .search-grid .company-field, .search-grid .topic-field { grid-column: auto; } .search-actions { align-items: flex-start; flex-direction: column; } .market { width: 100%; } .market-option { flex: 1; justify-content: center; padding-inline: 8px; } }
    @media (max-width: 600px) { body { padding: 10px; } input[type="text"] { width: 100%; } }
  </style>
</head>
<body>
  <header class="shell"><h1>Untitled</h1><button id="language-toggle" type="button" aria-label="Switch page to German" data-de-aria-label="Seite auf Englisch anzeigen">Deutsch</button></header>
  <section class="search-area" aria-label="Search controls" data-de-aria-label="Suchsteuerung"><div class="search-shell"><div class="search-card">
    <h2 class="search-heading" data-de="Markt für Berichte auswählen">Choose a filing market</h2>
    <fieldset class="market" aria-label="Filing market" data-de-aria-label="Markt für Berichte">
      <span class="market-option selected" aria-current="true"><span aria-hidden="true">🇺🇸</span> <span data-de="Vereinigte Staaten">United States</span></span>
      <span class="market-option coming-soon" aria-disabled="true"><span aria-hidden="true">🇩🇪</span> <span data-de="Deutschland">Germany</span></span>
    </fieldset>
    <div class="market-fields us-fields search-grid">
      <div class="search-field company-field"><label for="us-company" data-de="Unternehmen, Börsenkürzel oder Link zu einem SEC-Bericht">Company, ticker, or SEC filing link</label><input id="us-company" type="search" placeholder="e.g., PepsiCo or PEP" data-de-placeholder="z. B. PepsiCo oder PEP"></div>
      <div class="search-field"><label for="us-type" data-de="Berichtsart">Filing type</label><select id="us-type"><option data-de="Jahresbericht (10-K)">Annual report (10-K)</option><option data-de="Quartalsbericht (10-Q)">Quarterly report (10-Q)</option><option data-de="Alle Berichte">Any filing</option></select></div>
      <div class="search-field"><label for="us-period" data-de="Zeitraum">Period</label><select id="us-period"><option data-de="Alle Jahre">Any year</option><option>2025</option><option>2024</option><option>2023</option></select></div>
      <div class="search-field topic-field"><label for="us-topic" data-de="Thema eingrenzen (optional)">Focus on a topic (optional)</label><select id="us-topic"><option data-de="Alle Themen">All topics</option><option data-de="Umsatzrealisierung">Revenue recognition</option><option data-de="Rückstellungen und Schätzungen">Reserves and estimates</option><option data-de="Abschreibungen und Nutzungsdauern">Depreciation and useful lives</option><option data-de="Nicht-GAAP-Kennzahlen">Non-GAAP measures</option></select></div>
    </div>
    <div class="search-actions"><button type="button">⌕ &nbsp; <span data-de="Berichte suchen">Find filings</span></button><p class="search-note" data-de="Durchsuchen Sie die Berichtsquellen des gewählten Marktes. Die Live-Suche nach Berichten ist noch nicht verbunden.">Search the selected market’s filing sources. Live filing lookup is not connected yet.</p></div>
  </div></div></section>
  <main class="shell"><section class="feed" aria-label="Latest financial updates" data-de-aria-label="Aktuelle Finanzmeldungen">
    <h2 class="feed-heading" data-de="Aktuelle Meldungen">Latest updates</h2>
    <!-- FEED_ITEMS -->
  </section></main>
  <script data-cfasync="false">
    const languageKey = 'pageLanguage';
    const toggle = document.getElementById('language-toggle');
    const text = [...document.querySelectorAll('[data-de]')].map(element => ({
      element, en: element.textContent, de: element.getAttribute('data-de')
    }));
    const attributes = ['aria-label', 'placeholder', 'alt'].flatMap(attribute =>
      [...document.querySelectorAll(`[data-de-${attribute}]`)].map(element => ({
        element, attribute, en: element.getAttribute(attribute), de: element.getAttribute(`data-de-${attribute}`)
      }))
    );
    function showLanguage(language) {
      for (const item of text) item.element.textContent = item[language];
      for (const item of attributes) item.element.setAttribute(item.attribute, item[language]);
      document.documentElement.lang = language;
      toggle.textContent = language === 'de' ? 'English' : 'Deutsch';
    }
    let savedLanguage;
    try { savedLanguage = localStorage.getItem(languageKey); } catch (_) { /* Private storage may be unavailable. */ }
    let language = savedLanguage === 'de' ? 'de' : 'en';
    showLanguage(language);
    toggle.addEventListener('click', () => {
      language = language === 'en' ? 'de' : 'en';
      showLanguage(language);
      try { localStorage.setItem(languageKey, language); } catch (_) { /* Keep the current-visit choice. */ }
    });
  </script>
</body>
</html>
