title: "Project #1 Documentation"
description: Project guides and contributor documentation
url: https://423F26.github.io
baseurl: /project1
repository: 423F26/project1
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
defaults:
  - scope:
      path: ""
    values:
      layout: default
readme_index:
  remove_originals: true
exclude:
  - src
  - public
  - test
  - docs/agile
  - node_modules
  - data
  - certs
  - package.json
  - package-lock.json
  - compose.yaml
  - Dockerfile
